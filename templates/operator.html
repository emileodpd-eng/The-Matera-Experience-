<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard operatori | Matera Experience</title><style>body{margin:0;background:#f6f6f1;color:#243d2e;font:14px system-ui}header{background:#234d3c;color:white;padding:20px 6%;font:26px Georgia}main{max-width:1100px;margin:40px auto;padding:0 20px}h1{font:40px Georgia}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;padding:25px;border:1px solid #e0e6df;border-radius:13px;margin:18px 0}label{display:block;font-weight:700;font-size:12px;margin:14px 0 6px}input,select{width:100%;padding:11px;border:1px solid #cbd6cd;border-radius:7px;box-sizing:border-box}button{background:#234d3c;color:white;border:0;border-radius:7px;padding:12px 17px;cursor:pointer;margin-top:13px}button:disabled{opacity:.5}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:12px}th{color:#66756a}.scroll{overflow-x:auto}.message{color:#a33}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header>matera experience. / operatori</header><main><h1>Dashboard operatori</h1><div id="login" class="panel"><h2>Accedi</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="loginBtn">Accedi</button><p class="message" id="loginMsg"></p></div><div id="dashboard" class="hidden"><p id="welcome"></p><button id="logout">Esci</button><div class="grid"><div class="panel"><h2>Aggiungi esperienza</h2><label>Titolo</label><input id="title"><label>Località</label><input id="location" value="Matera"><label>Prezzo per persona (€)</label><input id="price" type="number" min="0" step="0.01" value="25"><label>Modalità</label><select id="mode"><option value="request">Su richiesta</option><option value="direct">Pagamento diretto</option></select><button id="addExp">Salva esperienza</button></div><div class="panel"><h2>Aggiungi partenza</h2><label>Esperienza</label><select id="exp"></select><label>Data e ora locale (Matera)</label><input id="starts" type="datetime-local"><label>Posti</label><input id="capacity" type="number" min="1" value="12"><button id="addSlot">Salva partenza</button></div></div><p id="message"></p><div class="panel"><h2>Partenze</h2><div class="scroll"><table><thead><tr><th>Esperienza</th><th>Data / ora</th><th>Posti totali</th><th>Residui</th></tr></thead><tbody id="slots"></tbody></table></div></div><div class="panel"><h2>Prenotazioni e richieste</h2><div class="scroll"><table><thead><tr><th>Codice</th><th>Cliente</th><th>Persone</th><th>Stato</th><th>Gestione</th></tr></thead><tbody id="bookings"></tbody></table></div></div></div></main><script>
const $=id=>document.getElementById(id);async function api(path,options){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw Error(d.error||'Errore');return d}function txt(el,s){el.textContent=s}async function refresh(){const d=await api('/api/operator/dashboard');$('exp').replaceChildren(...d.experiences.map(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.title;return o}));$('slots').replaceChildren(...d.slots.map(s=>{const tr=document.createElement('tr');[s.experience_title,new Date(s.starts_at).toLocaleString('it-IT',{timeZone:'Europe/Rome'}),s.capacity,s.remaining].forEach(v=>{const td=document.createElement('td');txt(td,String(v));tr.append(td)});return tr}));$('bookings').replaceChildren(...d.bookings.map(b=>{const tr=document.createElement('tr');[b.reference,b.name+' ('+b.email+')',b.guests,b.status].forEach(v=>{const td=document.createElement('td');txt(td,String(v));tr.append(td)});const td=document.createElement('td');if(b.status==='pending_request'){for(const [status,label] of [['confirmed','Conferma'],['declined','Rifiuta']]){const btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{try{await api('/api/operator/bookings/'+b.id,{method:'PATCH',body:JSON.stringify({status})});refresh()}catch(e){txt($('message'),e.message)}};td.append(btn)}}tr.append(td);return tr}))}async function logged(){try{const me=await api('/api/operator/me');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');txt($('welcome'),'Benvenuto, '+me.name);refresh()}catch(e){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden')}}$('loginBtn').onclick=async()=>{try{await api('/api/operator/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});logged()}catch(e){txt($('loginMsg'),e.message)}};$('logout').onclick=async()=>{await api('/api/operator/logout',{method:'POST'});logged()};$('addExp').onclick=async()=>{try{await api('/api/operator/experiences',{method:'POST',body:JSON.stringify({title:$('title').value,location:$('location').value,price_cents:Math.round(Number($('price').value)*100),booking_mode:$('mode').value})});txt($('message'),'Esperienza salvata');refresh()}catch(e){txt($('message'),e.message)}};$('addSlot').onclick=async()=>{try{const local=$('starts').value;if(!local)throw Error('Scegli data e ora');const utc=new Date(local).toISOString();await api('/api/operator/slots',{method:'POST',body:JSON.stringify({experience_id:Number($('exp').value),starts_at:utc,capacity:Number($('capacity').value)})});txt($('message'),'Partenza salvata');refresh()}catch(e){txt($('message'),e.message)}};logged();</script></body></html>
